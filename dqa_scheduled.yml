name: DQA Kobo -> Neon (planifié)

on:
  schedule:
    # Toutes les heures, à la minute 0 (heure UTC). Ajuste selon ton besoin :
    # "*/30 * * * *"  -> toutes les 30 minutes
    # "0 */6 * * *"   -> toutes les 6 heures
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permet aussi de lancer le run manuellement depuis l'onglet Actions

jobs:
  run-dqa:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter le pipeline DQA
        env:
          KOBO_SERVER: ${{ secrets.KOBO_SERVER }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python dqa_kobo_to_neon.py
